[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genomex"
version = "0.3.0"
description = "Unified bacterial/fungal genome QC: contamination detection and comparative gene-content analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["genomex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["tools: requires external bioinformatics tools (prodigal/hmmer/mmseqs2/fastANI)"]
